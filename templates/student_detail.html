{% extends "base.html" %}
{% block content %}
<div class="card mt-4 student-detail">
  <div class="card-header text-white fancy-header">
    <img src="{{ url_for('static', filename='student_pics/' + student.image_file) }}"
         class="rounded-circle mb-2 shadow"
         style="width:70px; height:70px; object-fit:cover; border:3px solid white;">
    <h4 class="mt-2">{{ student.name }} {{ student.surname }}</h4>
  </div>

  <div class="card-body">
    <p><strong>Date of Birth:</strong> {{ student.dob }}</p>
    <p><strong>Class:</strong> {{ student.class_name }}</p>
    <p><strong>Phone:</strong> {{ student.phone }}</p>
  </div>
</div>

  <div class="card-footer">
    <a href="/student/{{ student.id }}/update" class="btn btn-warning btn-sm">Update</a>
    <form action="/student/{{ student.id }}/delete" method="POST" style="display:inline;">
      <button type="submit" class="btn btn-danger btn-sm">Delete</button>
    </form>
    <a href="/view_all" class="btn btn-secondary btn-sm">Back to List</a>
    <a href="/add-student" class="btn btn-success btn-sm">Add Another Student</a>
  </div>

{% endblock content %}
